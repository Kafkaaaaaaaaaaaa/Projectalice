<style>
  :root{
    --bg:#0b0e0d;
    --panel:#121613;
    --line:#233028;
    --amber:#ff9f1c;
    --amber-dim:#8a5b16;
    --green:#5ee6a0;
    --text:#d8e4dc;
    --text-dim:#6f8177;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  .fc-root{
    font-family:'JetBrains Mono','SF Mono',Consolas,monospace;
    background:
      radial-gradient(ellipse at top, #141a16 0%, var(--bg) 60%);
    color:var(--text);
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  @media (max-width:520px){
    .fc-root{padding:0;}
    .fc-card{max-width:100%; height:100dvh; border-radius:0; border-left:none; border-right:none;}
    .fc-body{padding:20px;}
  }
  .fc-card{
    width:100%;
    max-width:480px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:4px;
    box-shadow:0 0 0 1px #000, 0 20px 60px -20px rgba(0,0,0,0.8);
    overflow:hidden;
  }
  .fc-topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 16px;
    border-bottom:1px solid var(--line);
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--text-dim);
  }
  .fc-dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--text-dim);
    display:inline-block;
    margin-right:6px;
  }
  .fc-dot.live{background:var(--green); box-shadow:0 0 8px var(--green);}
  .fc-body{padding:28px;}
  .fc-eyebrow{
    color:var(--amber-dim);
    font-size:11px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    margin:0 0 6px;
  }
  .fc-title{
    font-size:22px;
    color:var(--amber);
    margin:0 0 4px;
    letter-spacing:0.02em;
  }
  .fc-sub{
    color:var(--text-dim);
    font-size:12.5px;
    margin:0 0 26px;
    line-height:1.5;
  }
  .fc-label{
    font-size:10.5px;
    color:var(--text-dim);
    letter-spacing:0.14em;
    text-transform:uppercase;
    margin-bottom:6px;
    display:block;
  }
  .fc-field{margin-bottom:16px;}
  .fc-freq-row{display:flex; gap:8px;}
  .fc-input{
    width:100%;
    background:#0e1210;
    border:1px solid var(--line);
    color:var(--text);
    padding:11px 12px;
    font-family:inherit;
    font-size:16px;
    border-radius:3px;
    outline:none;
    letter-spacing:0.04em;
  }
  @media (min-width:521px){
    .fc-input{font-size:14px;}
  }
  .fc-input:focus{border-color:var(--amber-dim);}
  .fc-input.fc-code{
    letter-spacing:0.35em;
    text-transform:uppercase;
    font-size:16px;
    text-align:center;
  }
  .fc-dice{
    flex:0 0 auto;
    background:#0e1210;
    border:1px solid var(--line);
    color:var(--text-dim);
    width:42px;
    border-radius:3px;
    cursor:pointer;
    font-size:15px;
  }
  .fc-dice:hover{color:var(--amber); border-color:var(--amber-dim);}
  .fc-btn{
    width:100%;
    background:var(--amber);
    color:#1a1300;
    border:none;
    padding:12px;
    font-family:inherit;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    border-radius:3px;
    cursor:pointer;
    margin-top:6px;
  }
  .fc-btn:hover{background:#ffb84d;}
  .fc-btn:disabled{opacity:0.4; cursor:not-allowed;}
  .fc-error{
    color:#ff6b6b;
    font-size:12px;
    margin-top:10px;
    min-height:14px;
  }

  /* Chat screen */
  .fc-chat{display:flex; flex-direction:column; height:78vh; height:78dvh; max-height:640px;}
  @media (max-width:520px){
    .fc-chat{height:100%; max-height:none;}
  }
  .fc-chat-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px;
    border-bottom:1px solid var(--line);
  }
  .fc-freq-badge{
    color:var(--amber);
    font-size:15px;
    letter-spacing:0.3em;
    font-weight:700;
  }
  .fc-leave{
    background:none; border:1px solid var(--line); color:var(--text-dim);
    font-family:inherit; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase;
    padding:6px 10px; border-radius:3px; cursor:pointer;
  }
  .fc-leave:hover{color:var(--text); border-color:var(--text-dim);}
  .fc-messages{
    flex:1;
    overflow-y:auto;
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .fc-empty{
    color:var(--text-dim);
    font-size:12.5px;
    text-align:center;
    margin:auto;
    line-height:1.6;
  }
  .fc-msg{
    max-width:80%;
    padding:8px 12px;
    border-radius:3px;
    font-size:13.5px;
    line-height:1.45;
    border:1px solid var(--line);
    background:#0e1310;
    align-self:flex-start;
  }
  .fc-msg.me{
    align-self:flex-end;
    background:#1a1608;
    border-color:var(--amber-dim);
  }
  .fc-msg-meta{
    font-size:10px;
    color:var(--text-dim);
    letter-spacing:0.06em;
    margin-bottom:3px;
    text-transform:uppercase;
  }
  .fc-msg.me .fc-msg-meta{color:var(--amber-dim);}
  .fc-composer{
    display:flex; gap:8px;
    padding:14px;
    border-top:1px solid var(--line);
  }
  .fc-composer input{
    flex:1;
  }
  .fc-send{
    background:var(--amber);
    color:#1a1300;
    border:none;
    padding:0 18px;
    font-family:inherit;
    font-weight:700;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    border-radius:3px;
    cursor:pointer;
  }
  .fc-send:disabled{opacity:0.4; cursor:not-allowed;}
  .fc-messages::-webkit-scrollbar{width:6px;}
  .fc-messages::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}
</style>

<div id="fc-root" class="fc-root"></div>

<script>
(function(){
  const root = document.getElementById('fc-root');
  let screen = 'join'; // 'join' | 'chat'
  let code = '';
  let name = '';
  let error = '';
  let messages = [];
  let pollTimer = null;
  let lastCount = 0;

  function genCode(){
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = '';
    for(let i=0;i<5;i++) s += chars[Math.floor(Math.random()*chars.length)];
    return s;
  }

  function esc(str){
    const d = document.createElement('div');
    d.innerText = str;
    return d.innerHTML;
  }

  async function loadMessages(){
    try{
      const res = await window.storage.get('chat:' + code, true);
      const list = res && res.value ? JSON.parse(res.value) : [];
      if(list.length !== lastCount){
        messages = list;
        lastCount = list.length;
        render();
        scrollToBottom();
      }
    }catch(e){
      // key doesn't exist yet — treat as empty
      if(messages.length !== 0){
        messages = [];
        lastCount = 0;
        render();
      }
    }
  }

  async function sendMessage(text){
    if(!text.trim()) return;
    const entry = { user: name, text: text.trim(), ts: Date.now() };
    let list = [];
    try{
      const res = await window.storage.get('chat:' + code, true);
      list = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){ list = []; }
    list.push(entry);
    if(list.length > 300) list = list.slice(list.length - 300);
    try{
      await window.storage.set('chat:' + code, JSON.stringify(list), true);
    }catch(e){
      console.error('send failed', e);
      return;
    }
    messages = list;
    lastCount = list.length;
    render();
    scrollToBottom();
  }

  function scrollToBottom(){
    const el = document.getElementById('fc-messages');
    if(el) el.scrollTop = el.scrollHeight;
  }

  function startPolling(){
    stopPolling();
    pollTimer = setInterval(loadMessages, 1800);
  }
  function stopPolling(){
    if(pollTimer) clearInterval(pollTimer);
    pollTimer = null;
  }

  function timeStr(ts){
    const d = new Date(ts);
    return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }

  function renderJoin(){
    root.innerHTML = `
      <div class="fc-card">
        <div class="fc-topbar">
          <span><span class="fc-dot"></span>frequency chat</span>
          <span>offline</span>
        </div>
        <div class="fc-body">
          <p class="fc-eyebrow">tune in</p>
          <h1 class="fc-title">Pick a frequency</h1>
          <p class="fc-sub">Share a code with someone. Anyone who enters it lands in the same room — no accounts, no setup.</p>

          <div class="fc-field">
            <label class="fc-label">your name</label>
            <input id="fc-name" class="fc-input" placeholder="e.g. Alice" maxlength="20" value="${esc(name)}"/>
          </div>

          <div class="fc-field">
            <label class="fc-label">frequency code</label>
            <div class="fc-freq-row">
              <input id="fc-code" class="fc-input fc-code" placeholder="XXXXX" maxlength="8" value="${esc(code)}"/>
              <button id="fc-dice" class="fc-dice" title="Generate a new code">⟳</button>
            </div>
          </div>

          <button id="fc-join" class="fc-btn">Enter room</button>
          <div class="fc-error">${esc(error)}</div>
        </div>
      </div>
    `;

    document.getElementById('fc-dice').onclick = () => {
      code = genCode();
      document.getElementById('fc-code').value = code;
    };
    document.getElementById('fc-code').oninput = (e) => {
      code = e.target.value.toUpperCase();
    };
    document.getElementById('fc-name').oninput = (e) => {
      name = e.target.value;
    };
    document.getElementById('fc-join').onclick = doJoin;
    root.querySelectorAll('input').forEach(inp=>{
      inp.addEventListener('keydown', e=>{ if(e.key==='Enter') doJoin(); });
    });
  }

  function doJoin(){
    const nameVal = document.getElementById('fc-name').value.trim();
    const codeVal = document.getElementById('fc-code').value.trim().toUpperCase();
    if(!nameVal){ error='Enter a name first.'; renderJoin(); return; }
    if(!codeVal){ error='Enter or generate a frequency code.'; renderJoin(); return; }
    name = nameVal;
    code = codeVal;
    error = '';
    screen = 'chat';
    lastCount = 0;
    messages = [];
    render();
    loadMessages().then(scrollToBottom);
    startPolling();
  }

  function renderChat(){
    root.innerHTML = `
      <div class="fc-card">
        <div class="fc-chat">
          <div class="fc-chat-head">
            <div>
              <div class="fc-freq-badge">${esc(code)}</div>
              <div style="font-size:10.5px;color:var(--text-dim);letter-spacing:0.08em;text-transform:uppercase;margin-top:2px;">
                <span class="fc-dot live"></span>connected as ${esc(name)}
              </div>
            </div>
            <button id="fc-leave" class="fc-leave">Leave</button>
          </div>
          <div id="fc-messages" class="fc-messages">
            ${messages.length === 0
              ? '<div class="fc-empty">Nothing on this frequency yet.<br/>Send the first message.</div>'
              : messages.map(m => `
                <div class="fc-msg ${m.user===name ? 'me':''}">
                  <div class="fc-msg-meta">${esc(m.user)} · ${timeStr(m.ts)}</div>
                  <div>${esc(m.text)}</div>
                </div>
              `).join('')
            }
          </div>
          <div class="fc-composer">
            <input id="fc-msg-input" class="fc-input" placeholder="Type a message..." maxlength="500"/>
            <button id="fc-send" class="fc-send">Send</button>
          </div>
        </div>
      </div>
    `;
    const input = document.getElementById('fc-msg-input');
    const send = () => {
      const val = input.value;
      if(!val.trim()) return;
      input.value = '';
      sendMessage(val);
    };
    document.getElementById('fc-send').onclick = send;
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
    document.getElementById('fc-leave').onclick = () => {
      stopPolling();
      screen = 'join';
      messages = [];
      error = '';
      render();
    };
    input.focus();
  }

  function render(){
    if(screen === 'join') renderJoin();
    else renderChat();
  }

  code = genCode();
  render();
})();
</script>
